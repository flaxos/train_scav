  - THROUGH_MAIN
  - PLATFORM_TRACK
  - PASSING_LOOP
  - GOODS_YARD_TRACK
  - LOADING_TRACK
  - HEADSHUNT
  - AGRICULTURAL_SPUR

reference_composition:
  corridor: single-track secondary or branch railway
  station: passenger platform with double-ended passing loop
  freight: compact goods/loading track with road-served shed
  shunting: headshunt or equivalent clear length for simple recovery moves
  world: settlement road, creek bridge and agricultural/loading facility

governance_labels:
  observed: directly present in corpus/source material
  inferred: relationship inferred from multiple observations
  design_prior: chosen before sufficient corpus frequency evidence exists
  gameplay_abstraction: deliberate compression or departure for playability
